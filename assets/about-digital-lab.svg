<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="lab-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Subtle Glow Radials -->
    <radialGradient id="lab-glow-cyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="lab-glow-violet" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="lab-glow-emerald" cx="50%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Flow Connector Gradients -->
    <linearGradient id="flow-topleft-center" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="flow-topright-center" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="flow-botleft-center" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="flow-botright-center" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.9" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="lab-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#334155" stroke-width="0.8" stroke-opacity="0.12" />
    </pattern>

    <!-- Filter Glow -->
    <filter id="hub-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Plate -->
  <rect width="850" height="400" rx="14" fill="url(#lab-bg)" stroke="#1e293b" stroke-width="1.2" />
  <rect width="850" height="400" rx="14" fill="url(#lab-grid)" />
  <rect width="850" height="400" rx="14" fill="url(#lab-glow-cyan)" />
  <rect width="850" height="400" rx="14" fill="url(#lab-glow-violet)" />
  <rect width="850" height="400" rx="14" fill="url(#lab-glow-emerald)" />

  <!-- Top Lab Sub-Header -->
  <g transform="translate(32, 28)">
    <text font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.5">
      // 01 : THE DIGITAL LAB ARCHITECTURE
    </text>
    <text x="786" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b" letter-spacing="1" text-anchor="end">
      NEXUS: MULTI-DISCIPLINARY
    </text>
  </g>

  <!-- CONNECTOR PATHS (Connecting Disciplines to Center Hub) -->
  <g>
    <!-- Top-Left to Center -->
    <path d="M 290 115 C 360 115, 360 190, 425 190" fill="none" stroke="url(#flow-topleft-center)" stroke-width="1.5" stroke-dasharray="3,3" />
    <!-- Top-Right to Center -->
    <path d="M 560 115 C 490 115, 490 190, 425 190" fill="none" stroke="url(#flow-topright-center)" stroke-width="1.5" stroke-dasharray="3,3" />
    <!-- Bottom-Left to Center -->
    <path d="M 290 265 C 360 265, 360 190, 425 190" fill="none" stroke="url(#flow-botleft-center)" stroke-width="1.5" stroke-dasharray="3,3" />
    <!-- Bottom-Right to Center -->
    <path d="M 560 265 C 490 265, 490 190, 425 190" fill="none" stroke="url(#flow-botright-center)" stroke-width="1.5" stroke-dasharray="3,3" />
  </g>

  <!-- 01. TOP-LEFT: AI / INTELLIGENCE (Dominant Block) -->
  <g transform="translate(32, 55)">
    <rect width="258" height="120" rx="10" fill="#090d16" fill-opacity="0.95" stroke="#38bdf8" stroke-width="1.2" />
    <rect x="0" y="0" width="258" height="26" rx="10" fill="#0284c7" fill-opacity="0.2" />
    
    <!-- Title + Status -->
    <text x="14" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8">
      01 // AI &amp; INTELLIGENCE
    </text>
    <rect x="195" y="5" width="52" height="16" rx="4" fill="#0369a1" fill-opacity="0.4" />
    <text x="221" y="16.5" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#7dd3fc" text-anchor="middle">ACTIVE</text>

    <!-- Content -->
    <text x="14" y="48" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Neural Logic &amp; Predictive Models</text>
    <text x="14" y="66" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">PyTorch • Computer Vision • LLMs</text>
    <text x="14" y="82" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Clinical Triage &amp; Crowd Modeling</text>

    <!-- Bottom Tag -->
    <rect x="14" y="94" width="230" height="16" rx="3" fill="#0f172a" />
    <text x="20" y="105.5" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8">PyTorch · OpenCV · RAG · Python</text>
  </g>

  <!-- 02. TOP-RIGHT: 3D / SPATIAL WEB (Spatial Block) -->
  <g transform="translate(560, 55)">
    <rect width="258" height="120" rx="10" fill="#090d16" fill-opacity="0.95" stroke="#c084fc" stroke-width="1.2" />
    <rect x="0" y="0" width="258" height="26" rx="10" fill="#7c3aed" fill-opacity="0.2" />
    
    <!-- Title + Status -->
    <text x="14" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#c084fc">
      02 // 3D &amp; SPATIAL WEB
    </text>
    <rect x="185" y="5" width="62" height="16" rx="4" fill="#6d28d9" fill-opacity="0.4" />
    <text x="216" y="16.5" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#d8b4fe" text-anchor="middle">BUILDING</text>

    <!-- Content -->
    <text x="14" y="48" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Hardware-Accelerated WebGL</text>
    <text x="14" y="66" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Three.js • GLSL Vertex/Fragment</text>
    <text x="14" y="82" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Camera Physics • Mesh Instancing</text>

    <!-- Bottom Tag -->
    <rect x="14" y="94" width="230" height="16" rx="3" fill="#0f172a" />
    <text x="20" y="105.5" font-family="'JetBrains Mono', monospace" font-size="9" fill="#c084fc">Three.js · WebGL · GLSL · Shaders</text>
  </g>

  <!-- CENTER CONVERGENCE NEXUS CORE -->
  <g transform="translate(425, 190)">
    <!-- Ambient Halo -->
    <circle cx="0" cy="0" r="48" fill="#818cf8" fill-opacity="0.08" />
    <circle cx="0" cy="0" r="36" fill="#0f172a" stroke="#818cf8" stroke-width="1.8" filter="url(#hub-glow)" />
    
    <!-- Rotating Dashed Orbit Ring -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite" />
    </circle>
    
    <!-- Center Hexagon / Logo -->
    <polygon points="0,-14 12,-7 12,7 0,14 -12,7 -12,-7" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.2" />
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="900" fill="#ffffff" text-anchor="middle">
      NEXUS
    </text>
  </g>

  <!-- 03. BOTTOM-LEFT: FULL-STACK SYSTEMS (Engineering Block) -->
  <g transform="translate(32, 205)">
    <rect width="258" height="120" rx="10" fill="#090d16" fill-opacity="0.95" stroke="#f43f5e" stroke-width="1.2" />
    <rect x="0" y="0" width="258" height="26" rx="10" fill="#e11d48" fill-opacity="0.2" />
    
    <!-- Title + Status -->
    <text x="14" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#f43f5e">
      03 // FULL-STACK SYSTEMS
    </text>
    <rect x="185" y="5" width="62" height="16" rx="4" fill="#9f1239" fill-opacity="0.4" />
    <text x="216" y="16.5" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#fda4af" text-anchor="middle">SHIPPING</text>

    <!-- Content -->
    <text x="14" y="48" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Scalable Architecture &amp; APIs</text>
    <text x="14" y="66" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Next.js App Router • TypeScript</text>
    <text x="14" y="82" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Node.js • Spring Boot • Microservices</text>

    <!-- Bottom Tag -->
    <rect x="14" y="94" width="230" height="16" rx="3" fill="#0f172a" />
    <text x="20" y="105.5" font-family="'JetBrains Mono', monospace" font-size="9" fill="#f43f5e">Next.js · Node · Spring · MongoDB</text>
  </g>

  <!-- 04. BOTTOM-RIGHT: INTERACTION CRAFT (Design Engineering Block) -->
  <g transform="translate(560, 205)">
    <rect width="258" height="120" rx="10" fill="#090d16" fill-opacity="0.95" stroke="#34d399" stroke-width="1.2" />
    <rect x="0" y="0" width="258" height="26" rx="10" fill="#059669" fill-opacity="0.2" />
    
    <!-- Title + Status -->
    <text x="14" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#34d399">
      04 // INTERACTION CRAFT
    </text>
    <rect x="180" y="5" width="67" height="16" rx="4" fill="#065f46" fill-opacity="0.4" />
    <text x="213.5" y="16.5" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#a7f3d0" text-anchor="middle">EXPLORING</text>

    <!-- Content -->
    <text x="14" y="48" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Motion Physics &amp; Luxury UX</text>
    <text x="14" y="66" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">GSAP ScrollTrigger Choreography</text>
    <text x="14" y="82" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Lenis Smooth Scroll • Zero Jank</text>

    <!-- Bottom Tag -->
    <rect x="14" y="94" width="230" height="16" rx="3" fill="#0f172a" />
    <text x="20" y="105.5" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34d399">GSAP · Lenis · Framer · Tailwind</text>
  </g>

  <!-- BOTTOM METADATA BAR (Signature Synthesis Line) -->
  <g transform="translate(32, 345)">
    <rect width="786" height="38" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="24" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#94a3b8">
      CORE SYNTHESIS: <tspan fill="#38bdf8">AI / ML</tspan> → <tspan fill="#c084fc">3D WEBGL</tspan> → <tspan fill="#f43f5e">FULL-STACK</tspan> → <tspan fill="#34d399">DIGITAL EXPERIENCE</tspan>
    </text>
    <text x="766" y="24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#34d399" text-anchor="end">
      60FPS // ZERO-JANK
    </text>
  </g>
</svg>
