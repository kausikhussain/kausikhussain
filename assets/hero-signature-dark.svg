<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070c" />
      <stop offset="45%" stop-color="#080d19" />
      <stop offset="100%" stop-color="#0d1527" />
    </linearGradient>

    <!-- Volumetric Ambient Lighting -->
    <radialGradient id="glow-core-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-core-violet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.28" />
      <stop offset="65%" stop-color="#6366f1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-ambient-left" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Typography Metallic Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- 3D Polyhedron Gradients -->
    <linearGradient id="poly-face-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.06" />
    </linearGradient>

    <linearGradient id="poly-face-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="poly-face-3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="line-flow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#c084fc" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <!-- Architectural Grid Pattern -->
    <pattern id="arch-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#334155" stroke-width="0.8" stroke-opacity="0.14" />
      <circle cx="0" cy="0" r="0.9" fill="#64748b" fill-opacity="0.35" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="core-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="node-pulse-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Plate & Grid Layer -->
  <rect width="960" height="360" rx="16" fill="url(#bg-dark)" />
  <rect width="960" height="360" rx="16" fill="url(#arch-grid)" />
  <rect width="960" height="360" rx="16" fill="url(#glow-ambient-left)" />

  <!-- Outer Precision Border -->
  <rect x="1" y="1" width="958" height="358" rx="15" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-opacity="0.8" />
  <rect x="5" y="5" width="950" height="350" rx="13" fill="none" stroke="#0f172a" stroke-width="0.8" stroke-dasharray="8,6" />

  <!-- Corner Precision Crosshairs -->
  <g stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4">
    <path d="M 18 14 L 18 22 M 14 18 L 22 18" />
    <path d="M 942 14 L 942 22 M 938 18 L 946 18" />
    <path d="M 18 338 L 18 346 M 14 342 L 22 342" />
    <path d="M 942 338 L 942 346 M 938 342 L 946 342" />
  </g>

  <!-- TOP STATUS / TELEMETRY BAR -->
  <g transform="translate(48, 30)">
    <!-- Active Research Status Pill -->
    <rect width="270" height="26" rx="13" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
    <circle cx="15" cy="13" r="4" fill="#34d399" filter="url(#node-pulse-glow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="17" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#a7f3d0" letter-spacing="1">
      SYS_ID: KH-CORE-01 // ACTIVE_LAB
    </text>

    <!-- Top Right Telemetry -->
    <text x="864" y="17" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#64748b" letter-spacing="1" text-anchor="end">
      AI &#215; 3D &#215; SYSTEMS | LATENCY: <tspan fill="#34d399">&lt;16ms</tspan>
    </text>
  </g>

  <!-- LEFT / CENTER: BRAND MARK TYPOGRAPHY &amp; IDENTITY -->
  <g transform="translate(54, 90)">
    <!-- Architectural Subtitle Eyebrow -->
    <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="2">
      // DIGITAL INTELLIGENCE &amp; SPATIAL STUDIO
    </text>

    <!-- Main Architectural Brand Mark (KAUSIK HUSSAIN) -->
    <text x="0" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="52" font-weight="900" fill="url(#title-grad)" letter-spacing="2">
      KAUSIK HUSSAIN
    </text>

    <!-- Discipline Pill Row -->
    <g transform="translate(0, 88)">
      <!-- AI/ML Pill -->
      <rect x="0" y="0" width="76" height="22" rx="5" fill="#0284c7" fill-opacity="0.16" stroke="#38bdf8" stroke-width="0.9" />
      <text x="38" y="15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">AI / ML</text>

      <!-- 3D WebGL Pill -->
      <rect x="84" y="0" width="88" height="22" rx="5" fill="#7c3aed" fill-opacity="0.16" stroke="#a855f7" stroke-width="0.9" />
      <text x="128" y="15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#c084fc" text-anchor="middle">3D WEBGL</text>

      <!-- Full-Stack Pill -->
      <rect x="180" y="0" width="98" height="22" rx="5" fill="#059669" fill-opacity="0.16" stroke="#34d399" stroke-width="0.9" />
      <text x="229" y="15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#6ee7b7" text-anchor="middle">FULL-STACK</text>

      <!-- Creative Tech Pill -->
      <rect x="286" y="0" width="116" height="22" rx="5" fill="#e11d48" fill-opacity="0.14" stroke="#f43f5e" stroke-width="0.9" />
      <text x="344" y="15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#fda4af" text-anchor="middle">CREATIVE TECH</text>
    </g>

    <!-- Mission Statement -->
    <text x="0" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#e2e8f0" letter-spacing="0.3">
      Building <tspan fill="#38bdf8" font-weight="700">Intelligent Systems</tspan> and <tspan fill="#c084fc" font-weight="700">Immersive Digital Experiences</tspan>.
    </text>

    <!-- Architectural Pipeline Synthesis Flow -->
    <g transform="translate(0, 172)">
      <rect width="436" height="24" rx="6" fill="#090d16" fill-opacity="0.8" stroke="#1e293b" stroke-width="0.9" />
      <text x="14" y="16" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#94a3b8">
        <tspan fill="#38bdf8">DATA</tspan>
        <tspan fill="#64748b"> &#8594; </tspan>
        <tspan fill="#c084fc">INTELLIGENCE</tspan>
        <tspan fill="#64748b"> &#8594; </tspan>
        <tspan fill="#818cf8">GEOMETRY</tspan>
        <tspan fill="#64748b"> &#8594; </tspan>
        <tspan fill="#34d399">EXPERIENCE</tspan>
      </text>
    </g>
  </g>

  <!-- RIGHT / CENTER: FLOATING 3D GEOMETRIC INTELLIGENCE CORE (AI &#215; 3D) -->
  <g transform="translate(735, 185)">
    <!-- Volumetric Ambient Halos -->
    <circle cx="0" cy="0" r="135" fill="url(#glow-core-cyan)" />
    <circle cx="0" cy="0" r="110" fill="url(#glow-core-violet)" />

    <!-- Orbital Coordinate Rings (Slow Cinematic Rotation) -->
    <g>
      <!-- Outer Orbit Ring -->
      <ellipse cx="0" cy="0" rx="138" ry="46" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.35" stroke-dasharray="4,6">
        <animateTransform attributeName="transform" type="rotate" from="25" to="385" dur="36s" repeatCount="indefinite" />
      </ellipse>
      <!-- Inner Orbit Ring -->
      <ellipse cx="0" cy="0" rx="115" ry="115" fill="none" stroke="#8b5cf6" stroke-width="0.6" stroke-opacity="0.25" stroke-dasharray="8,8">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="48s" repeatCount="indefinite" />
      </ellipse>
    </g>

    <!-- 3D POLYHEDRAL INTELLIGENCE CONSTRUCT (Slowly Rotating) -->
    <g>
      <!-- Slow subtle geometric oscillation -->
      <animateTransform attributeName="transform" type="rotate" values="-4;4;-4" dur="8s" repeatCount="indefinite" />

      <!-- Facet 1 (Top-Left) -->
      <polygon points="0,-75 -65,-36 0,0" fill="url(#poly-face-1)" stroke="#38bdf8" stroke-width="1.4" />
      <!-- Facet 2 (Top-Right) -->
      <polygon points="0,-75 65,-36 0,0" fill="url(#poly-face-2)" stroke="#818cf8" stroke-width="1.4" />
      <!-- Facet 3 (Bottom-Left) -->
      <polygon points="-65,-36 0,75 0,0" fill="url(#poly-face-3)" stroke="#c084fc" stroke-width="1.4" />
      <!-- Facet 4 (Bottom-Right) -->
      <polygon points="65,-36 0,75 0,0" fill="url(#poly-face-1)" stroke="#38bdf8" stroke-width="1.4" />

      <!-- Internal Spatial Axis &amp; Tessellation Wireframes -->
      <line x1="0" y1="-75" x2="0" y2="75" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4,4" stroke-opacity="0.8" />
      <line x1="-65" y1="-36" x2="65" y2="-36" stroke="#c084fc" stroke-width="1" stroke-opacity="0.6" />
      <line x1="-65" y1="-36" x2="65" y2="36" stroke="#818cf8" stroke-width="0.8" stroke-opacity="0.4" />
      <line x1="65" y1="-36" x2="-65" y2="36" stroke="#818cf8" stroke-width="0.8" stroke-opacity="0.4" />

      <!-- Outer Diamond Shell Frame -->
      <polygon points="0,-92 80,0 0,92 -80,0" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="6,4" />

      <!-- Neural Core Nodes (Vertices with Glowing Pulses) -->
      <!-- Center Nexus Core -->
      <circle cx="0" cy="0" r="6" fill="#00f0ff" filter="url(#core-glow)" />
      <circle cx="0" cy="0" r="3" fill="#ffffff" />

      <!-- Vertex Nodes -->
      <circle cx="0" cy="-75" r="4.5" fill="#38bdf8" filter="url(#node-pulse-glow)">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="75" r="4.5" fill="#a855f7" filter="url(#node-pulse-glow)">
        <animate attributeName="opacity" values="1;0.6;1" dur="2.8s" repeatCount="indefinite" />
      </circle>
      <circle cx="-65" cy="-36" r="4" fill="#c084fc" />
      <circle cx="65" cy="-36" r="4" fill="#38bdf8" />
      <circle cx="80" cy="0" r="3.5" fill="#34d399" />
      <circle cx="-80" cy="0" r="3.5" fill="#38bdf8" />
    </g>

    <!-- Satellite Intelligence Nodes &amp; Flow Paths -->
    <g>
      <!-- Top Satellite Node -->
      <circle cx="-95" cy="-70" r="3" fill="#34d399" filter="url(#node-pulse-glow)">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite" />
      </circle>
      <line x1="-95" y1="-70" x2="-65" y2="-36" stroke="#34d399" stroke-width="0.8" stroke-opacity="0.4" stroke-dasharray="2,3" />

      <!-- Right Satellite Node -->
      <circle cx="105" cy="-55" r="3" fill="#38bdf8" filter="url(#node-pulse-glow)">
        <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.7s" repeatCount="indefinite" />
      </circle>
      <line x1="105" y1="-55" x2="65" y2="-36" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4" stroke-dasharray="2,3" />

      <!-- Bottom Satellite Node -->
      <circle cx="90" cy="70" r="3" fill="#f43f5e" filter="url(#node-pulse-glow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3.1s" repeatCount="indefinite" />
      </circle>
      <line x1="90" y1="70" x2="65" y2="-36" stroke="#f43f5e" stroke-width="0.8" stroke-opacity="0.4" stroke-dasharray="2,3" />
    </g>

    <!-- Technical Micro-Annotations around 3D Geometry -->
    <g font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b" letter-spacing="0.8">
      <text x="-120" y="-85" text-anchor="end">// TENSOR_LATENT: 0x4A</text>
      <text x="120" y="-70" text-anchor="start">// SHADER: GLSL_PBR</text>
      <text x="110" y="85" text-anchor="start">// 60FPS_WEBGL</text>
    </g>
  </g>

  <!-- BOTTOM ACCENT CALIBRATION RULE -->
  <g transform="translate(48, 332)">
    <rect x="0" y="0" width="864" height="1.5" fill="url(#line-flow-grad)" />
    <!-- Fine Calibration Ticks -->
    <line x1="160" y1="-3" x2="160" y2="4" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <line x1="432" y1="-3" x2="432" y2="4" stroke="#c084fc" stroke-width="1" stroke-opacity="0.6" />
    <line x1="700" y1="-3" x2="700" y2="4" stroke="#34d399" stroke-width="1" stroke-opacity="0.5" />
  </g>
</svg>