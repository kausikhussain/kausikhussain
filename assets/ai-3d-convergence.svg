<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="conv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0a0e1a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Radial Spots -->
    <radialGradient id="conv-glow-left" cx="20%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="conv-glow-right" cx="80%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="conv-glow-center" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>

    <!-- Connector Stream Gradients -->
    <linearGradient id="stream-left-to-center" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="stream-right-to-center" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="stream-down" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="conv-grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#334155" stroke-width="0.8" stroke-opacity="0.15" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="cglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Plate -->
  <rect width="850" height="320" rx="16" fill="url(#conv-bg)" />
  <rect width="850" height="320" rx="16" fill="url(#conv-grid)" />
  <rect width="850" height="320" rx="16" fill="url(#conv-glow-left)" />
  <rect width="850" height="320" rx="16" fill="url(#conv-glow-right)" />
  <rect width="850" height="320" rx="16" fill="url(#conv-glow-center)" />
  <rect x="1" y="1" width="848" height="318" rx="15" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-opacity="0.7" />

  <!-- SECTION HEADER INSIDE SVG -->
  <g transform="translate(40, 30)">
    <text font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.5">
      // 05 : ARCHITECTURAL CONVERGENCE PIPELINE
    </text>
    <text x="770" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b" letter-spacing="1" text-anchor="end">
      PRECISION ENGINE: v2.6
    </text>
  </g>

  <!-- LEFT COLUMN: AI / MACHINE LEARNING SUBSYSTEM -->
  <g transform="translate(40, 60)">
    <!-- Box Container -->
    <rect width="250" height="150" rx="10" fill="#090d16" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
    <rect x="0" y="0" width="250" height="28" rx="10" fill="#0369a1" fill-opacity="0.25" />
    <text x="14" y="19" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#38bdf8">
      01 // NEURAL INTELLIGENCE
    </text>

    <!-- Sub-steps / Feature list -->
    <g transform="translate(14, 46)">
      <!-- Step 1 -->
      <circle cx="5" cy="5" r="3" fill="#38bdf8" />
      <text x="16" y="9" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#e2e8f0">Multidimensional Feature Extr.</text>
      <!-- Step 2 -->
      <circle cx="5" cy="28" r="3" fill="#38bdf8" />
      <text x="16" y="32" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#e2e8f0">PyTorch &amp; OpenCV Vision Models</text>
      <!-- Step 3 -->
      <circle cx="5" cy="51" r="3" fill="#38bdf8" />
      <text x="16" y="55" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#e2e8f0">Semantic RAG &amp; LLM Context</text>
      <!-- Step 4 -->
      <circle cx="5" cy="74" r="3" fill="#34d399" />
      <text x="16" y="78" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#34d399">Real-Time Predictive Decision</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: 3D SPATIAL GRAPHICS SUBSYSTEM -->
  <g transform="translate(560, 60)">
    <!-- Box Container -->
    <rect width="250" height="150" rx="10" fill="#090d16" fill-opacity="0.9" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6" />
    <rect x="0" y="0" width="250" height="28" rx="10" fill="#6d28d9" fill-opacity="0.25" />
    <text x="14" y="19" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#c084fc">
      02 // 3D &amp; SPATIAL GRAPHICS
    </text>

    <!-- Sub-steps / Feature list -->
    <g transform="translate(14, 46)">
      <!-- Step 1 -->
      <circle cx="5" cy="5" r="3" fill="#c084fc" />
      <text x="16" y="9" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#e2e8f0">Three.js Mesh &amp; Buffers</text>
      <!-- Step 2 -->
      <circle cx="5" cy="28" r="3" fill="#c084fc" />
      <text x="16" y="32" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#e2e8f0">Custom GLSL Shaders &amp; PBR</text>
      <!-- Step 3 -->
      <circle cx="5" cy="51" r="3" fill="#c084fc" />
      <text x="16" y="55" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#e2e8f0">Lenis &amp; GSAP Kinetic Physics</text>
      <!-- Step 4 -->
      <circle cx="5" cy="74" r="3" fill="#f43f5e" />
      <text x="16" y="78" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#fda4af">Hardware-Accelerated 60fps</text>
    </g>
  </g>

  <!-- CENTER CONVERGENCE REACTOR CORE -->
  <g transform="translate(425, 135)">
    <!-- Converging Flow Paths (Left to Center) -->
    <path d="M -135 0 C -60 0, -50 0, 0 0" fill="none" stroke="url(#stream-left-to-center)" stroke-width="2.5" />
    <polygon points="-12,-5 0,0 -12,5" fill="#818cf8" />

    <!-- Converging Flow Paths (Right to Center) -->
    <path d="M 135 0 C 60 0, 50 0, 0 0" fill="none" stroke="url(#stream-right-to-center)" stroke-width="2.5" />
    <polygon points="12,-5 0,0 12,5" fill="#818cf8" />

    <!-- Core Rings -->
    <circle cx="0" cy="0" r="42" fill="#0f172a" stroke="#818cf8" stroke-width="1.8" filter="url(#cglow)" />
    <circle cx="0" cy="0" r="32" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite" />
    </circle>
    
    <!-- Central Hexagon / Symbol -->
    <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="#38bdf8" fill-opacity="0.3" stroke="#00f0ff" stroke-width="1.5" />
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">
      AI × 3D
    </text>
  </g>

  <!-- DOWNWARD STREAM TO SYNTHESIS OUTPUT -->
  <g transform="translate(425, 180)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="url(#stream-down)" stroke-width="2.5" />
    <polygon points="-5,35 0,44 5,35" fill="#34d399" />
  </g>

  <!-- BOTTOM OUTPUT CARD: IMMERSIVE DIGITAL EXPERIENCE -->
  <g transform="translate(175, 230)">
    <rect width="500" height="66" rx="10" fill="#090d16" fill-opacity="0.95" stroke="#34d399" stroke-width="1.2" />
    <rect x="0" y="0" width="500" height="4" rx="2" fill="#34d399" />
    
    <text x="250" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      ✨ IMMERSIVE DIGITAL INTELLIGENCE
    </text>
    <text x="250" y="48" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="500" fill="#94a3b8" text-anchor="middle">
      Real-Time Neural Inference <tspan fill="#34d399">×</tspan> GPU-Accelerated 3D WebGL <tspan fill="#34d399">×</tspan> Zero-Jank UX
    </text>
  </g>
</svg>
