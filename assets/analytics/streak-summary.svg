<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 175" width="100%" height="100%">
  <defs>
    <linearGradient id="panel-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0c111c" />
    </linearGradient>
    <radialGradient id="ring-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>
    <filter id="flame-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Panel Base -->
  <rect width="850" height="175" rx="10" fill="url(#panel-bg)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Vertical Dividers -->
  <line x1="283" y1="20" x2="283" y2="155" stroke="#1e293b" stroke-width="1" />
  <line x1="566" y1="20" x2="566" y2="155" stroke="#1e293b" stroke-width="1" />

  <!-- LEFT: TOTAL CONTRIBUTIONS -->
  <g transform="translate(141, 0)">
    <text x="0" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
      1,072
    </text>
    <text x="0" y="98" font-family="'JetBrains Mono', 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" fill="#34d399" text-anchor="middle" letter-spacing="0.4">
      Total Contributions
    </text>
    <text x="0" y="124" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8" text-anchor="middle">
      Aug 31, 2025 - Present
    </text>
  </g>

  <!-- CENTER: CURRENT STREAK -->
  <g transform="translate(425, 0)">
    <!-- Radial Back Glow -->
    <circle cx="0" cy="58" r="46" fill="url(#ring-glow)" />

    <!-- Circular Gauge -->
    <circle cx="0" cy="58" r="38" fill="none" stroke="#162032" stroke-width="5" />
    <circle cx="0" cy="58" r="38" fill="none" stroke="#00f0ff" stroke-width="5" stroke-linecap="round"
            stroke-dasharray="238.76" stroke-dashoffset="60" transform="rotate(-90 0 58)">
      <animate attributeName="stroke-dashoffset" values="238;60" dur="1.5s" fill="freeze" />
    </circle>

    <!-- Flame Icon at Top of Circle -->
    <g transform="translate(-8, 10)" filter="url(#flame-glow)">
      <path d="M8 0 C8 0 4 4.5 4 8 C4 10.2 5.8 12 8 12 C10.2 12 12 10.2 12 8 C12 4.5 8 0 8 0 Z" fill="#34d399">
        <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite" />
      </path>
    </g>

    <!-- Streak Number -->
    <text x="0" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">
      10
    </text>

    <!-- Label & Dates -->
    <text x="0" y="118" font-family="'JetBrains Mono', 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="0.5">
      Current Streak
    </text>
    <text x="0" y="138" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8" text-anchor="middle">
      Aug 21 - Aug 30
    </text>
  </g>

  <!-- RIGHT: LONGEST STREAK -->
  <g transform="translate(708, 0)">
    <text x="0" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="36" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
      19
    </text>
    <text x="0" y="98" font-family="'JetBrains Mono', 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" fill="#34d399" text-anchor="middle" letter-spacing="0.4">
      Longest Streak
    </text>
    <text x="0" y="124" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8" text-anchor="middle">
      Mar 20 - Apr 7
    </text>
  </g>
</svg>