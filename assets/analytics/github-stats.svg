<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 415 210" width="100%" height="100%">
  <defs>
    <linearGradient id="stats-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0c111c" />
    </linearGradient>
  </defs>

  <rect width="415" height="210" rx="10" fill="url(#stats-bg)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Title -->
  <text x="35" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0ea5e9" letter-spacing="0.3">
    Stats
  </text>

  <!-- Metric 1: Total Stars -->
  <g transform="translate(35, 68)">
    <path d="M6 1 L7.5 4.8 L11.5 5.1 L8.5 7.7 L9.4 11.7 L6 9.5 L2.6 11.7 L3.5 7.7 L0.5 5.1 L4.5 4.8 Z" fill="none" stroke="#94a3b8" stroke-width="1.2" />
    <text x="22" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">Total Stars:</text>
    <text x="135" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">5</text>
  </g>

  <!-- Metric 2: Total Commits -->
  <g transform="translate(35, 96)">
    <!-- Commit icon: line with circle in center -->
    <circle cx="6" cy="6" r="3.5" fill="none" stroke="#94a3b8" stroke-width="1.2" />
    <line x1="0" y1="6" x2="2.5" y2="6" stroke="#94a3b8" stroke-width="1.2" />
    <line x1="9.5" y1="6" x2="12" y2="6" stroke="#94a3b8" stroke-width="1.2" />
    <text x="22" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">Total Commits:</text>
    <text x="135" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">380+</text>
  </g>

  <!-- Metric 3: Total PRs -->
  <g transform="translate(35, 124)">
    <!-- PR icon -->
    <circle cx="3" cy="3" r="2" fill="none" stroke="#94a3b8" stroke-width="1.2" />
    <circle cx="3" cy="11" r="2" fill="none" stroke="#94a3b8" stroke-width="1.2" />
    <circle cx="9" cy="5" r="2" fill="none" stroke="#94a3b8" stroke-width="1.2" />
    <line x1="3" y1="5" x2="3" y2="9" stroke="#94a3b8" stroke-width="1.2" />
    <path d="M3 3 C3 7, 9 5, 9 7" fill="none" stroke="#94a3b8" stroke-width="1.2" />
    <text x="22" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">Total PRs:</text>
    <text x="135" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">1</text>
  </g>

  <!-- Metric 4: Total Issues -->
  <g transform="translate(35, 152)">
    <!-- Issue circle with ! inside -->
    <circle cx="6" cy="6" r="5" fill="none" stroke="#94a3b8" stroke-width="1.2" />
    <line x1="6" y1="3.5" x2="6" y2="6.5" stroke="#94a3b8" stroke-width="1.2" />
    <circle cx="6" cy="8.5" r="0.6" fill="#94a3b8" />
    <text x="22" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">Total Issues:</text>
    <text x="135" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">1</text>
  </g>

  <!-- Metric 5: Contributed to -->
  <g transform="translate(35, 180)">
    <!-- Repo icon -->
    <rect x="2" y="2" width="8" height="9" rx="1.5" fill="none" stroke="#94a3b8" stroke-width="1.2" />
    <line x1="4" y1="5" x2="8" y2="5" stroke="#94a3b8" stroke-width="1" />
    <line x1="4" y1="7.5" x2="7" y2="7.5" stroke="#94a3b8" stroke-width="1" />
    <text x="22" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">Contributed to:</text>
    <text x="135" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">53</text>
  </g>

