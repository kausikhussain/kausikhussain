<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 60" width="100%" height="100%">
  <defs>
    <linearGradient id="footer-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0" />
      <stop offset="25%" stop-color="#8b5cf6" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#34d399" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="60" fill="transparent" />
  
  <!-- Glowing Center Backdrop -->
  <ellipse cx="400" cy="30" rx="120" ry="20" fill="url(#center-glow)" />

  <!-- Horizontal Rule Line -->
  <line x1="40" y1="30" x2="760" y2="30" stroke="url(#footer-line)" stroke-width="1.5" />

  <!-- Center Node Diamond -->
  <g transform="translate(400, 30)">
    <rect x="-6" y="-6" width="12" height="12" rx="2" fill="#0b0f19" stroke="#38bdf8" stroke-width="1.5" transform="rotate(45)" />
    <circle cx="0" cy="0" r="2.5" fill="#a78bfa" />
  </g>
</svg>
