<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 64" width="100%" height="100%">
  <defs>
    <linearGradient id="footer-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="20%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="1" />
      <stop offset="80%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="footer-center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="850" height="64" fill="transparent" />
  
  <!-- Subtle Center Glow -->
  <ellipse cx="425" cy="32" rx="140" ry="24" fill="url(#footer-center-glow)" />

  <!-- Horizontal Axis Line -->
  <line x1="45" y1="32" x2="805" y2="32" stroke="url(#footer-line-grad)" stroke-width="1.5" />

  <!-- Fine Calibration Ticks -->
  <line x1="150" y1="28" x2="150" y2="36" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
  <line x1="280" y1="29" x2="280" y2="35" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
  <line x1="570" y1="29" x2="570" y2="35" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4" />
  <line x1="700" y1="28" x2="700" y2="36" stroke="#34d399" stroke-width="1" stroke-opacity="0.5" />

  <!-- Center Signature Hexagon Node -->
  <g transform="translate(425, 32)">
    <polygon points="0,-10 8.66,-5 8.66,5 0,10 -8.66,5 -8.66,-5" fill="#090d16" stroke="#c084fc" stroke-width="1.5" />
    <circle cx="0" cy="0" r="3" fill="#38bdf8" />
  </g>
</svg>
