<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Glowing Orbs -->
    <radialGradient id="glow-violet" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-cyan" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-emerald" cx="50%" cy="90%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="title-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f3f4f6" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="line-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0" />
      <stop offset="30%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Container Base -->
  <rect width="800" height="240" rx="16" fill="url(#bg-gradient)" />
  
  <!-- Grid Overlay -->
  <rect width="800" height="240" rx="16" fill="url(#grid)" />

  <!-- Glows -->
  <rect width="800" height="240" rx="16" fill="url(#glow-violet)" />
  <rect width="800" height="240" rx="16" fill="url(#glow-cyan)" />
  <rect width="800" height="240" rx="16" fill="url(#glow-emerald)" />

  <!-- Outer Border Glass Outline -->
  <rect x="1" y="1" width="798" height="238" rx="15" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.4" />
  
  <!-- Status Badge Pill -->
  <g transform="translate(48, 38)">
    <rect width="250" height="26" rx="13" fill="#1e1b4b" fill-opacity="0.6" stroke="#4c1d95" stroke-width="1" stroke-opacity="0.8" />
    <circle cx="15" cy="13" r="4" fill="#34d399">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="17" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#a7f3d0" letter-spacing="1">
      OPEN FOR COLLABORATION
    </text>
  </g>

  <!-- Decorative Top Right Badges -->
  <g transform="translate(560, 38)">
    <rect width="68" height="24" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="34" y="16" font-family="monospace" font-size="10" font-weight="600" fill="#38bdf8" text-anchor="middle">AI/ML</text>
  </g>
  <g transform="translate(636, 38)">
    <rect width="116" height="24" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="58" y="16" font-family="monospace" font-size="10" font-weight="600" fill="#c084fc" text-anchor="middle">3D EXPERIENCES</text>
  </g>

  <!-- Main Name Title -->
  <text x="48" y="122" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="800" fill="url(#title-gradient)" letter-spacing="1.5">
    KAUSIK HUSSAIN
  </text>

  <!-- Divider Line -->
  <rect x="48" y="142" width="704" height="1.5" fill="url(#line-gradient)" />

  <!-- Subtitle Tagline -->
  <text x="48" y="175" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
    <tspan fill="#38bdf8" font-weight="700">AI</tspan>
    <tspan fill="#64748b"> • </tspan>
    <tspan fill="#c084fc" font-weight="700">Full Stack</tspan>
    <tspan fill="#64748b"> • </tspan>
    <tspan fill="#f43f5e" font-weight="700">3D Web Experiences</tspan>
    <tspan fill="#64748b"> • </tspan>
    <tspan fill="#34d399" font-weight="700">UI/UX Craftsmanship</tspan>
  </text>

  <!-- Bottom Accent Text / Vision -->
  <text x="48" y="202" font-family="monospace" font-size="11" font-weight="400" fill="#64748b" letter-spacing="0.8">
    // Architecting modern, high-performance &amp; intelligent digital products
  </text>

  <!-- Glowing Corner Dots -->
  <circle cx="752" cy="188" r="3" fill="#38bdf8" opacity="0.8" />
  <circle cx="740" cy="188" r="2" fill="#8b5cf6" opacity="0.6" />
  <circle cx="730" cy="188" r="1.5" fill="#f43f5e" opacity="0.4" />
</svg>
