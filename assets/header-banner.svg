<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="45%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Orbs -->
    <radialGradient id="glow-cyan" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-violet" cx="25%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-emerald" cx="50%" cy="95%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Typography Gradients -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#f1f5f9" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="poly-edge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="poly-face-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.03" />
    </linearGradient>

    <linearGradient id="poly-face-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="divider-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#c084fc" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <!-- Architectural Grid Pattern -->
    <pattern id="arch-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.16" />
      <circle cx="0" cy="0" r="1" fill="#64748b" fill-opacity="0.3" />
    </pattern>

    <!-- Neural Glow Filter -->
    <filter id="node-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Plate & Rounded Border -->
  <rect width="850" height="280" rx="18" fill="url(#bg-grad)" />
  <rect width="850" height="280" rx="18" fill="url(#arch-grid)" />
  <rect width="850" height="280" rx="18" fill="url(#glow-violet)" />
  <rect width="850" height="280" rx="18" fill="url(#glow-cyan)" />
  <rect width="850" height="280" rx="18" fill="url(#glow-emerald)" />
  
  <!-- Outer Precision Stroke -->
  <rect x="1" y="1" width="848" height="278" rx="17" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.6" />
  <rect x="5" y="5" width="840" height="270" rx="14" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4" stroke-dasharray="6,4" />

  <!-- Top Status Bar Pill -->
  <g transform="translate(48, 32)">
    <rect width="280" height="28" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="14" r="4.5" fill="#34d399" filter="url(#node-glow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <text x="30" y="18" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="600" fill="#a7f3d0" letter-spacing="1.2">
      ACTIVE RESEARCH &amp; LAB // SIH'25
    </text>
  </g>

  <!-- Technical Telemetry Coordinates (Upper Right) -->
  <g transform="translate(730, 36)">
    <text font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#64748b" letter-spacing="1" text-anchor="end">
      SYS_CORE: <tspan fill="#38bdf8">AI·3D·ENG</tspan> | LATENCY: <tspan fill="#34d399">&lt;16ms</tspan>
    </text>
  </g>

  <!-- LEFT HERO TYPOGRAPHY -->
  <g transform="translate(48, 120)">
    <!-- Primary Identity Name -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="46" font-weight="900" fill="url(#title-grad)" letter-spacing="2">
      KAUSIK HUSSAIN
    </text>

    <!-- Subtitle Domain Pill Row -->
    <g transform="translate(0, 16)">
      <!-- AI/ML Pill -->
      <rect x="0" y="0" width="76" height="22" rx="6" fill="#0284c7" fill-opacity="0.18" stroke="#38bdf8" stroke-width="0.9" />
      <text x="38" y="14.5" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#38bdf8" text-anchor="middle">AI / ML</text>

      <!-- 3D WebGL Pill -->
      <rect x="84" y="0" width="86" height="22" rx="6" fill="#7c3aed" fill-opacity="0.18" stroke="#a855f7" stroke-width="0.9" />
      <text x="127" y="14.5" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#c084fc" text-anchor="middle">3D WEBGL</text>

      <!-- Full-Stack Pill -->
      <rect x="178" y="0" width="98" height="22" rx="6" fill="#059669" fill-opacity="0.18" stroke="#34d399" stroke-width="0.9" />
      <text x="227" y="14.5" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#6ee7b7" text-anchor="middle">FULL-STACK</text>

      <!-- Creative Tech Pill -->
      <rect x="284" y="0" width="118" height="22" rx="6" fill="#e11d48" fill-opacity="0.15" stroke="#f43f5e" stroke-width="0.9" />
      <text x="343" y="14.5" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#fda4af" text-anchor="middle">CREATIVE TECH</text>
    </g>

    <!-- Mission Statement -->
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#cbd5e1" letter-spacing="0.4">
      Building <tspan fill="#38bdf8" font-weight="700">Intelligent Systems</tspan> and <tspan fill="#c084fc" font-weight="700">Immersive 3D Digital Experiences</tspan>.
    </text>

    <!-- Technical Architecture Annotation -->
    <text x="0" y="94" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="400" fill="#64748b" letter-spacing="0.8">
      // Machine Learning Pipelines • Hardware-Accelerated 3D • Scalable Systems
    </text>
  </g>

  <!-- RIGHT 3D ISOMETRIC POLYHEDRON & NEURAL LATTICE VISUAL (AI × 3D) -->
  <g transform="translate(680, 142)">
    <!-- Ambient Radial Halo behind 3D Mesh -->
    <circle cx="0" cy="0" r="85" fill="#38bdf8" fill-opacity="0.08" />
    <circle cx="0" cy="0" r="55" fill="#8b5cf6" fill-opacity="0.12" />

    <!-- Orbital Coordinate Rings -->
    <ellipse cx="0" cy="0" rx="90" ry="32" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.35" stroke-dasharray="4,6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="0" cy="0" rx="75" ry="75" fill="none" stroke="#8b5cf6" stroke-width="0.6" stroke-opacity="0.25" stroke-dasharray="6,8">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="25s" repeatCount="indefinite" />
    </ellipse>

    <!-- 3D Polyhedral Facets (Translucent Shaded Faces) -->
    <!-- Top Face -->
    <polygon points="0,-60 52,-30 0,0 -52,-30" fill="url(#poly-face-grad-1)" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Right Face -->
    <polygon points="0,0 52,-30 52,30 0,60" fill="url(#poly-face-grad-2)" stroke="#818cf8" stroke-width="1.5" />
    <!-- Left Face -->
    <polygon points="-52,-30 0,0 0,60 -52,30" fill="url(#poly-face-grad-1)" stroke="#c084fc" stroke-width="1.5" />

    <!-- Internal Wireframe Tessellation Lines -->
    <line x1="0" y1="-60" x2="0" y2="60" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.8" />
    <line x1="-52" y1="-30" x2="52" y2="30" stroke="#c084fc" stroke-width="0.8" stroke-opacity="0.6" />
    <line x1="-52" y1="30" x2="52" y2="-30" stroke="#818cf8" stroke-width="0.8" stroke-opacity="0.6" />

    <!-- Neural Network Node Points (Vertices with Glow) -->
    <!-- Center Node -->
    <circle cx="0" cy="0" r="5" fill="#00f0ff" filter="url(#node-glow)" />
    <!-- Top Node -->
    <circle cx="0" cy="-60" r="4" fill="#38bdf8" />
    <!-- Bottom Node -->
    <circle cx="0" cy="60" r="4" fill="#a855f7" />
    <!-- Left Top Node -->
    <circle cx="-52" cy="-30" r="4" fill="#c084fc" />
    <!-- Left Bottom Node -->
    <circle cx="-52" cy="30" r="4" fill="#38bdf8" />
    <!-- Right Top Node -->
    <circle cx="52" cy="-30" r="4" fill="#38bdf8" />
    <!-- Right Bottom Node -->
    <circle cx="52" cy="30" r="4" fill="#c084fc" />

    <!-- Satellite Neural Nodes / Data Particles -->
    <circle cx="-75" cy="-45" r="2.5" fill="#34d399" filter="url(#node-glow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" />
    </circle>
    <line x1="-75" y1="-45" x2="-52" y2="-30" stroke="#34d399" stroke-width="0.8" stroke-opacity="0.4" />

    <circle cx="70" cy="-40" r="2.5" fill="#38bdf8" filter="url(#node-glow)">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <line x1="70" y1="-40" x2="52" y2="-30" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4" />

    <circle cx="65" cy="50" r="2.5" fill="#f43f5e" filter="url(#node-glow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <line x1="65" y1="50" x2="52" y2="30" stroke="#f43f5e" stroke-width="0.8" stroke-opacity="0.4" />
  </g>

  <!-- Bottom Accent Precision Rule -->
  <rect x="48" y="258" width="754" height="1.5" fill="url(#divider-grad)" />
</svg>
